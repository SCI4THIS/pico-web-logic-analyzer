<!DOCTYPE html>
<h1>Configure</h1>
Frequency: <input id="frequency" type="number" value="1000"> Hz <br />
Channel Count: <input id="channel_count" type="number" value="1"> <br />
<div id="channels">
<input id="channel_0" type="number" value="0" max="23" value="1">
</div>
Chunk Size: <select id="chunkSize">
  <option value="256">256 B</option>
  <option value="1024">1 KiB</option>
  <option value="4096">4 KiB</option>
</select>
<button id="configure">Configure</button>
<h1>Actions</h1>
<button onclick="send_cmd('STATUS')">STATUS</button>
<br />
<button onclick="send_cmd('SINGLE_CAPTURE')">SINGLE_CAPTURE</button>
<br />
<button onclick="send_cmd('CAPTURE_CHAIN_START')">CAPTURE_CHAIN_START</button>
<button onclick="send_cmd('CAPTURE_CHAIN_STOP')">CAPTURE_CHAIN_STOP</button>
<br />
<button onclick="send_cmd('PIN_TEST')">PIN_TEST</button>
<br />
<button onclick="send_cmd('CAPTURE_CHAIN_ANALYSIS_START')">CAPTURE_CHAIN_ANALYSIS_START</button>
<button onclick="send_cmd('CAPTURE_CHAIN_ANALYSIS_STOP')">CAPTURE_CHAIN_ANALYSIS_STOP</button>
<br />
<button onclick="send_cmd('STREAM_START')">STREAM_START</button>
<button onclick="send_cmd('STREAM_STOP')">STREAM_STOP</button>
<br />
<button onclick="send_cmd('STREAM_ANALYSIS_START')">STREAM_ANALYSIS_START</button>
<button onclick="send_cmd('STREAM_ANALYSIS_STOP')">STREAM_ANALYSIS_STOP</button>
<pre id="output"></pre>
<pre id="stats"></pre>
<script>
const output = document.querySelector("#output");
const ws_url = 'ws://' + location.host + '/';
var ws = new WebSocket(ws_url);
var line_count = 0;
ws.binaryType = "arraybuffer";
var lastSequence;
var expectedSample;
var totalSamples;
var startTime;
var analysisMode = false;

function update_channel_count(e) {
  const countInput = document.getElementById("channel_count");
  const container = document.getElementById("channels");
  const count = Math.max(1, Math.min(24, countInput.value));
  countInput.value = count;
  const previous = Array.from(container.querySelectorAll("input")).map(function(input) { return input.value });
  container.replaceChildren();
  for (let i=0; i<count; i++) {
    const label = document.createElement("label");
    const input = document.createElement("input");
    input.id = `channel_${i}`;
    input.type = "number";
    input.min = "0";
    input.max = "23";
    input.value = previous[i] ?? i;
    label.append(`Channel ${i + 1}: `, input);
    container.append(label, document.createElement("br"));
  }
}

document.getElementById("channel_count").value = 1;
update_channel_count(event);
document.getElementById("channel_count").onchange = update_channel_count;

function handle_analysis(view, data)
{
  const sequence = view.getUint32(4, true);
  const sampleCount = view.getUint32(8, true);
  const sampleRate = view.getUint32(12, true);
  const overruns = view.getUint32(16, true);
  const payloadBytes = view.getUint32(20, true);
  const firstSample = view.getBigUint64(24, true);
  if (lastSequence !== undefined && sequence !== ((lastSequence + 1) >>> 0)) {
    console.warn("Sequence gap");
  }
  if (expectedSample !== undefined && firstSample !== expectedSample) {
    console.warn("Sample gap");
  }
  lastSequence = sequence;
  expectedSample = firstSample + BigInt(sampleCount);
  totalSamples += sampleCount;
  const bytesPerSample = payloadBytes / sampleCount;
  const payload = new DataView(data, 40, payloadBytes);
  const displayed = Math.min(sampleCount, 32);
  const samples = [];

  for (let index = 0; index < displayed; index++) {
    const offset = index * bytesPerSample;
    const value = bytesPerSample === 1
      ? payload.getUint8(offset)
      : bytesPerSample === 2
        ? payload.getUint16(offset, true)
        : payload.getUint32(offset, true);
    samples.push(`${index}: ${value}`);
  }

  output.textContent = samples.join("\n");
  const seconds = (performance.now() - startTime) / 1000;
  stats.textContent =
    `Configured: ${sampleRate} sample/s\n` +
    `Delivered: ${(totalSamples / seconds).toFixed(1)} sample/s\n` +
    `Sequence: ${sequence}\n` +
    `Overruns: ${overruns}`;
}

ws.onmessage = function(event) {
  if (line_count == 64) {
    output.textContent = "";
    line_count = 0;
  }
  if (typeof event.data == "string") {
    output.textContent += event.data + "\n";
    line_count++;
    if (event.data === "CAPTURE_CHAIN_ANALYSIS_STARTED") {
      analysisMode = true;
      lastSequence = undefined;
      expectedSample = undefined;
      totalSamples = 0;
      startTime = performance.now();
    }
    if (event.data === "STREAM_ANALYSIS_STARTED") {
      analysisMode = true;
      lastSequence = undefined;
      expectedSample = undefined;
      totalSamples = 0;
      startTime = performance.now();
    }
    if (event.data === "CAPTURE_CHAIN_ANALYSIS_STOPPED" ||
        event.data === "STREAM_ANALYSIS_STOPPED" ||
        event.data === "CAPTURE_CHAIN_STARTED" ||
        event.data === "STREAM_STARTED") {
      analysisMode = false;
    }
    return;
  }
  const view = new DataView(event.data);
  if (analysisMode && view.byteLength >= 40) {
    const magic = view.getUint32(0, true);
    if (magic === 0x31414C50) {
      handle_analysis(view, event.data);
      return;
    }
  }
  const samples = new Uint8Array(event.data);
  output.textContent += Array.from(samples).join(" ") + "\n";
  line_count++;
}

function send_cmd(s) {
  output.textContent = "";
  line_count = 0;
  ws.send(s);
}

document.getElementById("configure").onclick = function() {
  const count = Number(document.getElementById("channel_count").value);
  const selectedChannels = [];
  for (let i=0; i<count; i++) {
    const channel = Number(document.getElementById(`channel_${i}`).value);
    if (!Number.isInteger(channel) || channel < 0 || channel >= 24) {
      output.textContent = `Channel ${i + 1} must be between 0 and 23\n`;
      return;
    }
    selectedChannels.push(channel);
  }

  ws.send(`SET_FREQ ${frequency.value}`);
  ws.send(`SET_CHUNK_SIZE ${chunkSize.value}`);
  ws.send(`SET_CHANNEL_COUNT ${selectedChannels.length}`);
  selectedChannels.forEach((channel, index) => {
    ws.send(`SET_CHANNEL ${index} ${channel}`);
  });
}
</script>
