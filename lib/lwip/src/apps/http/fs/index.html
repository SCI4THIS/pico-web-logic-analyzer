<!DOCTYPE html>
<html>
<head>
<title>Pico Web Logic Analyzer</title>
<script>

const ws_url = 'ws://' + location.host + '/';
var ws = new WebSocket(ws_url);
ws.binaryType = "arraybuffer"

ws.onmessage = function(e) {
  console.log(new Uint8Array(e.data))
}

function send_cmd(s) {
  ws.send(s)
}
</script>
</head>
<body>
  <button onclick="send_cmd('STATUS')">STATUS</button>
</body>
</html>
